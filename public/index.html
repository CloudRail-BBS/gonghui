<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方碑 · MC 公会中心</title>
<meta name="description" content="方碑是独立于服务器的 Minecraft 公会平台：登记公会、赛季积分榜、双方确认的战报、赛事对阵与荣誉墙。">
<meta name="theme-color" content="#0A0C0F">
<meta property="og:title" content="方碑 · MC 公会中心">
<meta property="og:description" content="跨服务器公会榜，战绩由双方确认后计入。">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/favicon.svg">
<style>
:root{
  --bg:#0A0C0F; --s900:#0F1115; --s850:#14171C; --s800:#191D23; --s700:#232830;
  --line:#232832; --soft:#1A1F26;
  --tx:#E9EDF2; --tx2:#A9B3BF; --mut:#77828F;
  --ac:#2DD4BF; --ac6:#0FA896; --ac4:#5EEAD4; --gd:#E8B44B;
  --hero-bg:#0B0E12; --card1:#15181E; --card2:#12151A; --pod1:#13161B;
  --hdr-bg:rgba(10,12,15,.86); --champ2:rgba(20,23,28,.9);
  --on-accent:#B8FFF3; --ok-text:#8FE3D6; --gold-text:#F6E2B8;
  --accent-soft:rgba(45,212,191,.1); --stripe:rgba(255,255,255,.016);
  --sans:"HarmonyOS Sans SC",MiSans,"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --disp:"Space Grotesk",var(--sans);
  --mono:"JetBrains Mono","Cascadia Code",Consolas,"Courier New",monospace;
  --r:10px; --max:1220px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html[data-theme="light"]{
  --bg:#F4F6F9; --s900:#FFFFFF; --s850:#FFFFFF; --s800:#EFF2F7; --s700:#E2E7EF;
  --line:#DCE2EA; --soft:#E9EDF3;
  --tx:#111820; --tx2:#3E4652; --mut:#69737F;
  --ac:#0FA896; --ac6:#0B8B7D; --ac4:#0A7A6D; --gd:#A9781B;
  --hero-bg:#EDF2F8; --card1:#FFFFFF; --card2:#FBFCFE; --pod1:#FFFFFF;
  --hdr-bg:rgba(255,255,255,.9); --champ2:rgba(255,255,255,.92);
  --on-accent:#0A5F57; --ok-text:#0A6B61; --gold-text:#7A5A16;
  --accent-soft:rgba(15,168,150,.12); --stripe:rgba(0,0,0,.02);
}
html[data-theme="light"] body{
  background-image:radial-gradient(900px 480px at 82% -6%,rgba(15,168,150,.10),transparent 62%),radial-gradient(600px 400px at 6% 2%,rgba(15,168,150,.05),transparent 60%);
}
html[data-theme="light"] .hero::before{opacity:.55}
html[data-theme="light"] .overlay{background:rgba(18,24,30,.42)}
html[data-theme="light"] .drawer-ov{background:rgba(18,24,30,.32)}
html[data-theme="light"] .card,
html[data-theme="light"] .pod,
html[data-theme="light"] .ev{box-shadow:0 1px 2px rgba(17,24,32,.04)}
html[data-theme="light"] .toast{background:#E6F4F1;border-color:rgba(15,168,150,.4);color:#0A5F57}
html[data-theme="light"] .btn.p{box-shadow:0 6px 18px -12px rgba(15,168,150,.9)}
html[data-theme="light"] .cover{border-color:#D7DEE7}
html[data-theme="light"] .cover .pill{color:#D5E3E0;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.07)}
html[data-theme="light"] .cover .pill.t{color:#B8FFF3;border-color:rgba(45,212,191,.4);background:rgba(45,212,191,.16)}
html[data-theme="light"] .cover .pill.g{color:#F6DCA4;border-color:rgba(232,180,75,.32);background:rgba(232,180,75,.1)}
html[data-theme="light"] .table.rt tbody tr:hover,
html[data-theme="light"] table.rt tbody tr:hover{background:rgba(15,168,150,.06)}
html[data-theme="light"] .mt,html[data-theme="light"] .hm{color:var(--tx2)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:13.5px;line-height:1.65;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 480px at 82% -6%,rgba(45,212,191,.08),transparent 62%),radial-gradient(600px 400px at 6% 2%,rgba(45,212,191,.04),transparent 60%);background-repeat:no-repeat;background-attachment:fixed}
::selection{background:rgba(45,212,191,.22);color:#CCFBF1}
a{color:inherit;text-decoration:none}
button{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

/* ---------- header ---------- */
.hdr{position:sticky;top:0;z-index:60;background:var(--hdr-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--soft)}
.hdr-in{max-width:var(--max);margin:0 auto;padding:0 24px;height:58px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .mark{flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.brand .mark img.mark-img{display:block;width:auto;max-width:132px;object-fit:contain;border-radius:6px}
.brand .mark .mark-txt{display:grid;place-items:center;border-radius:7px;line-height:1;font-weight:800;letter-spacing:-.02em;color:#04211E;background:linear-gradient(145deg,var(--ac4),var(--ac6));box-shadow:0 4px 14px -6px rgba(45,212,191,.8)}
.brand .mark svg{display:block;width:27px;height:27px}
.brand-t{display:flex;flex-direction:column;line-height:1.1}
.brand-t b{font-size:14.5px;letter-spacing:.06em}
.brand-t small{font:500 8.5px var(--mono);color:var(--mut);letter-spacing:.22em;margin-top:2px}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:0 1 auto}
.nav::-webkit-scrollbar{display:none}
.nav a{font-size:13px;color:var(--tx2);padding:7px 12px;border-radius:7px;white-space:nowrap;transition:.15s}
.nav a:hover{color:var(--tx);background:var(--s850)}
.nav a.on{color:var(--ac4);background:rgba(45,212,191,.1);font-weight:600}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:6px;flex:0 0 auto}
.ibtn{background:none;border:1px solid transparent;color:var(--tx2);padding:6px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.ibtn:hover{background:var(--s850);color:var(--tx);border-color:var(--line)}
.ibtn svg{opacity:.8}
.dot-badge{min-width:15px;height:15px;border-radius:999px;background:var(--ac);color:#04211E;font:700 9.5px/15px var(--mono);text-align:center;padding:0 4px}
.ava{width:28px;height:28px;border-radius:7px;background:linear-gradient(145deg,#2C3A44,#1B242C);border:1px solid #35414C;display:grid;place-items:center;font-size:12px;font-weight:700;color:#CFE9E5;cursor:pointer}
.user-wrap{position:relative}
.umenu{position:absolute;right:0;top:40px;width:200px;background:var(--s850);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:0 24px 50px -20px #000;z-index:70}
.umenu .uhead{padding:9px 10px 10px;border-bottom:1px solid var(--soft);margin-bottom:5px}
.umenu .uhead b{display:block;font-size:13px}
.umenu .uhead span{display:block;font:10px var(--mono);color:var(--mut);margin-top:2px}
.umenu button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--tx2);font-size:12.5px;padding:7px 10px;border-radius:6px;cursor:pointer}
.umenu button:hover{background:var(--s800);color:var(--tx)}

/* ---------- mobile tabbar ---------- */
.tabbar{display:none}
.tabbar a{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  padding:6px 2px 5px;border-radius:10px;color:var(--mut);font-size:10px;letter-spacing:.02em;transition:color .15s,background .15s}
.tabbar a svg{display:block;width:19px;height:19px}
.tabbar a span{line-height:1.1;white-space:nowrap}
.tabbar a.on{color:var(--ac4);background:var(--accent-soft);font-weight:600}
.tabbar a:active{transform:scale(.96)}
.tabbar a.on::before{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:18px;height:2px;border-radius:2px;background:var(--ac4)}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;padding:8px 15px;border-radius:8px;border:1px solid transparent;cursor:pointer;transition:.16s;white-space:nowrap}
.btn.p{background:rgba(45,212,191,.13);border-color:rgba(45,212,191,.44);color:var(--on-accent);box-shadow:0 0 24px -10px rgba(45,212,191,.7),inset 0 0 16px rgba(45,212,191,.05)}
.btn.p:hover{background:rgba(45,212,191,.19);box-shadow:0 0 28px -8px rgba(45,212,191,.85)}
.btn.g{background:var(--s800);border-color:var(--line);color:var(--tx2)}
.btn.g:hover{border-color:#39414D;color:var(--tx)}
.btn.gold{background:rgba(232,180,75,.1);border-color:rgba(232,180,75,.3);color:#F3D99C}
.btn.gold:hover{background:rgba(232,180,75,.15)}
.btn.danger{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.26);color:#FCA5A5}
.btn.sm{padding:5px 11px;font-size:11.5px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font:11px var(--mono);color:var(--tx2);border:1px solid var(--line);background:var(--s850);padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.t{color:var(--on-accent);border-color:rgba(45,212,191,.33);background:var(--accent-soft)}
.pill.g{color:#F6DCA4;border-color:rgba(232,180,75,.28);background:rgba(232,180,75,.07)}
.pill.r{color:#FCA5A5;border-color:rgba(248,113,113,.25);background:rgba(248,113,113,.07)}
.st{font:9.5px var(--mono);padding:1px 6px;border-radius:4px;border:1px solid;white-space:nowrap;display:inline-block;line-height:1.6}
.st.ok{color:var(--ok-text);border-color:rgba(45,212,191,.28);background:rgba(45,212,191,.06)}
.st.pd{color:#DCC79A;border-color:rgba(232,180,75,.28);background:rgba(232,180,75,.06)}
.st.ds{color:#E8A3A3;border-color:rgba(248,113,113,.26);background:rgba(248,113,113,.06)}
.card{background:linear-gradient(180deg,var(--card1),var(--card2));border:1px solid var(--line);border-radius:12px}
.sec{margin:46px 0 0}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.sec-k{font:600 10px var(--mono);letter-spacing:.2em;color:var(--ac6);margin-bottom:5px}
.sec-h h2{font-family:var(--disp);font-size:20px;font-weight:750;margin:0;letter-spacing:-.01em}
.sec-h .more{font-size:12px;color:var(--mut)}
.sec-h .more:hover{color:var(--ac4)}
.divider{height:1px;background:var(--soft);margin:0}

/* ---------- home hero ---------- */
.hero{position:relative;overflow:hidden;background:var(--hero-bg)}
.hero::before{content:"";position:absolute;inset:0;background:
  radial-gradient(700px 340px at 20% 0%,rgba(45,212,191,.16),transparent 62%),
  radial-gradient(600px 300px at 90% 20%,rgba(232,180,75,.07),transparent 60%)}
.hero::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(125deg,transparent 0 80px,var(--stripe) 80px 82px)}
.hero-in{position:relative;z-index:1;max-width:var(--max);margin:0 auto;padding:56px 24px 46px;display:grid;grid-template-columns:1fr 320px;gap:48px;align-items:center}
.kicker{display:inline-flex;align-items:center;gap:8px;font:600 10px var(--mono);letter-spacing:.2em;color:var(--ac)}
.kicker::before{content:"";width:22px;height:1px;background:var(--ac);opacity:.75}
.dot-live{width:6px;height:6px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px rgba(45,212,191,.16);animation:pulse 2s infinite;display:inline-block;flex:0 0 auto}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.hero h1{font-family:var(--disp);font-size:clamp(30px,4.2vw,44px);line-height:1.18;font-weight:800;letter-spacing:-.02em;margin:18px 0 0}
.hero h1 em{font-style:normal;color:var(--ac4);text-shadow:0 0 46px rgba(45,212,191,.4)}
.hero .lead{color:var(--tx2);font-size:14.5px;max-width:520px;margin:16px 0 0}
.hero-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:20px;font:11.5px var(--mono);color:var(--mut)}
.hero-meta b{color:var(--tx2);font-weight:500}
.hero-cta{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.champ{position:relative;border:1px solid rgba(232,180,75,.22);border-radius:14px;padding:20px;background:linear-gradient(160deg,rgba(232,180,75,.12),var(--champ2) 58%);box-shadow:0 0 60px -34px rgba(232,180,75,.9)}
.champ-k{font:600 9.5px var(--mono);letter-spacing:.2em;color:var(--gd)}
.champ-badge{width:44px;height:44px;border-radius:11px;background:var(--gd);color:#1A1205;display:grid;place-items:center;font-size:20px;font-weight:800;margin:14px 0 10px;box-shadow:0 0 30px -8px rgba(232,180,75,.9)}
.champ-name{font-size:19px;font-weight:750}
.champ-sub{font:10.5px var(--mono);color:var(--mut);margin-top:2px}
.champ-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(232,180,75,.16)}
.champ-stats b{display:block;font:600 15px var(--mono);color:var(--gold-text)}
.champ-stats span{font-size:10px;color:#8E8471}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;width:calc(100% - 48px);max-width:calc(var(--max) - 48px);margin:0 auto;border-top:1px solid var(--soft);border-bottom:1px solid var(--soft)}
.stat{background:var(--bg);padding:18px 0 18px 24px;border-left:1px solid var(--soft)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:700 22px var(--mono);letter-spacing:-.02em}
.stat span{display:block;font-size:11px;color:var(--mut);margin-top:2px}

/* ---------- podium ---------- */
.podium{display:grid;grid-template-columns:1fr 1.12fr 1fr;gap:12px;align-items:end}
.pod{position:relative;border:1px solid var(--line);border-radius:12px;padding:20px 18px;background:linear-gradient(180deg,var(--card1),var(--card2));transition:.18s}
.pod:hover{border-color:rgba(45,212,191,.3);transform:translateY(-2px)}
.pod.first{border-color:rgba(232,180,75,.32);background:linear-gradient(180deg,rgba(232,180,75,.1),var(--pod1) 62%);padding-top:26px;padding-bottom:26px;box-shadow:0 0 60px -40px rgba(232,180,75,.9)}
.pod-rk{position:absolute;right:16px;top:14px;font:700 20px var(--mono);color:#4A545F;letter-spacing:-.03em}
.pod.first .pod-rk{color:rgba(232,180,75,.7)}
.pod-badge{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;font-size:17px;font-weight:800;color:#07110F;margin-bottom:12px}
.pod-name{font-size:16px;font-weight:700}
.pod-meta{font:10px var(--mono);color:var(--mut);margin-top:2px}
.pod-n{display:flex;align-items:baseline;gap:6px;margin-top:14px}
.pod-n b{font:700 22px var(--mono);letter-spacing:-.02em}
.pod-n span{font-size:10px;color:var(--mut)}

/* ---------- feed ---------- */
.feed{display:flex;flex-direction:column}
.fi{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--soft)}
.fi:last-child{border-bottom:0}
.fi-mark{width:3px;height:26px;border-radius:2px;background:var(--ac6);flex:0 0 auto;opacity:.8}
.fi-mark.l{background:#7C3A3A}
.fi-teams{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:13px}
.fi-teams b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fi-sc{font:600 13px var(--mono);padding:1px 7px;border-radius:5px;background:var(--accent-soft);color:var(--on-accent);flex:0 0 auto}
.fi-meta{font:10.5px var(--mono);color:var(--mut);text-align:right;flex:0 0 auto}
.fi-meta em{font-style:normal;display:block;color:#5C6774}

/* ---------- rank ---------- */
.page-h{padding:38px 0 22px}
.page-h .sec-k{margin-bottom:8px}
.page-h h1{font-family:var(--disp);font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em}
.page-h p{color:var(--mut);font-size:13px;margin:8px 0 0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 14px}
.sel{background:var(--s850);border:1px solid var(--line);color:var(--tx2);border-radius:8px;padding:7px 10px;font-size:12.5px;font-family:inherit;cursor:pointer;outline:none}
.sel:focus{border-color:rgba(45,212,191,.42)}
.search{position:relative;flex:1;min-width:180px;max-width:280px}
.search input{width:100%;background:var(--s850);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:8px 11px 8px 32px;font-size:12.5px;font-family:inherit;outline:none}
.search input:focus{border-color:rgba(45,212,191,.42);box-shadow:0 0 0 3px rgba(45,212,191,.06)}
.search input::placeholder{color:#5E6875}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mut)}
.segs{display:flex;gap:2px;background:var(--s850);border:1px solid var(--line);border-radius:8px;padding:3px}
.segs button{background:none;border:0;color:var(--mut);font-size:12px;padding:5px 11px;border-radius:6px;cursor:pointer;white-space:nowrap}
.segs button.on{background:rgba(45,212,191,.12);color:var(--ac4);font-weight:600}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--s900)}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px}
table.rt th{text-align:left;font:500 9.5px var(--mono);letter-spacing:.1em;color:var(--mut);padding:10px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;background:rgba(255,255,255,.012);white-space:nowrap}
table.rt th.num{text-align:right}
table.rt th.c-lv{width:82px} table.rt th.c-pts{width:100px} table.rt th.c-wr{width:88px}
table.rt th.c-mem{width:80px} table.rt th.c-form{width:94px} table.rt th.c-trend{width:72px}
table.rt th.c-rk{width:46px}
table.rt td{padding:11px 10px;border-bottom:1px solid var(--soft);color:var(--tx2);vertical-align:middle}
table.rt tbody tr{transition:.13s;cursor:pointer}
table.rt tbody tr:hover{background:rgba(45,212,191,.035)}
table.rt tbody tr:last-child td{border-bottom:0}
table.rt .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.rt .rk{font:600 11px var(--mono);color:#4E5965;width:44px}
table.rt tr.top1 .rk{color:var(--gd)}
table.rt tr.top2 .rk{color:#A8B4C0}
table.rt tr.top3 .rk{color:#B07A4A}
table.rt .strong{color:var(--tx);font-weight:600}
.gcell{display:flex;align-items:center;gap:10px;min-width:0}
.gbadge{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font-family:var(--sans);font-size:12.5px;font-weight:800;line-height:1;color:#07110F;flex:0 0 auto;text-align:center;overflow:hidden}
.gcell b{display:block;font-size:13px;font-weight:600;color:var(--tx);line-height:1.3}
.gcell .gsub{display:block;font:9.5px var(--mono);color:var(--mut);margin-top:1px;white-space:nowrap}
.dots{display:flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:#2F3742;display:block}
.dots i.w{background:var(--ac6)}
.dots i.l{background:#8E4A4A}
.trend{font:600 11px var(--mono);text-align:right}
.trend.up{color:var(--ac4)}
.trend.dn{color:#E08585}
.trend.fl{color:#4E5965}
.tfoot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--soft);font-size:11.5px;color:var(--mut)}
.empty{padding:60px 20px;text-align:center;color:var(--mut)}
.empty b{display:block;color:var(--tx2);font-size:14px;margin-bottom:4px}

/* ---------- guild space ---------- */
.cover{position:relative;border-radius:16px;overflow:hidden;margin-top:22px;border:1px solid #2A3038}
.cover-bg{position:absolute;inset:0}
.cover-bg::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(125deg,transparent 0 62px,rgba(255,255,255,.022) 62px 64px)}
.cover-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,11,14,.72),transparent 78%)}
.cover-in{position:relative;z-index:2;padding:18px 24px 22px}
.crumb{font:11px var(--mono);color:#8FA3A0;display:flex;gap:7px;align-items:center}
.crumb a:hover{color:var(--ac4)}
.gs-head{display:flex;gap:16px;align-items:flex-start;margin-top:26px}

/* ================= 服务端模式 =================
   同一份前端既能当静态演示（localStorage），也能连 Node 服务端。
   只要 /api/bootstrap 可用，就自动切到服务端模式。 */
let SERVER_MODE = false;
let ME_ID = null;
const MATCHES = [];

async function api(url, opt){
  const r = await fetch(url, Object.assign({ headers: { "Content-Type": "application/json" } }, opt || {}));
  let d = {};
  try { d = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(d.error || ("请求失败 " + r.status));
  return d;
}

function hydrate(s){
  if (!s) return;
  if (typeof s.firstRun === "boolean") state.firstRun = s.firstRun;
  if (s.guilds) { GUILDS.length = 0; s.guilds.forEach(g => GUILDS.push(g)); }
  if (s.reviews) REVIEWS = s.reviews;
  if (s.reports) REPORTS = s.reports;
  if (s.matches) { MATCHES.length = 0; s.matches.forEach(m => MATCHES.push(m)); }
  if (s.bracket) { BRACKET.length = 0; s.bracket.forEach(r => BRACKET.push(r)); }
  if (s.tournaments) { TOURNAMENTS.length = 0; s.tournaments.forEach(t => TOURNAMENTS.push(t)); }
  if (s.honors) { Object.keys(HONORS).forEach(k => delete HONORS[k]); Object.assign(HONORS, s.honors); }
  if (s.mails) MAILS = s.mails;
  if (s.signups) state.signups = s.signups;
  if (s.logs) { LOGS.length = 0; s.logs.forEach(l => LOGS.push(l)); }
  if (s.meta) {
    state.season = state.rankSeason = s.meta.season || "S3";
    if (s.meta.site) Object.assign(SITE, s.meta.site);
  }
}

function applyServer(d, doRender){
  hydrate(d.state);
  const me = d.me;
  ME_ID = me ? me.id : null;
  if (me) {
    state.session = { name: me.name, role: me.admin ? "admin" : "owner", guild: me.guildSlug, mc: me.mc };
    const g = me.guildSlug ? bySlug(me.guildSlug) : null;
    const entry = g && (g.roster || []).find(m => m.userId === me.id);
    const confirmed = MATCHES.filter(m => m.status === "confirmed" && (m.aSlug === me.guildSlug || m.bSlug === me.guildSlug));
    const wins = confirmed.filter(m => (m.aSlug === me.guildSlug ? m.sa > m.sb : m.sb > m.sa)).length;
    Object.assign(ME, {
      name: me.name, mc: me.mc || "—", email: me.email || "", guild: me.guildSlug,
      contrib: entry ? entry.contrib : 0,
      joined: entry ? entry.joined : (g ? g.founded : "—"),
      matches: confirmed.length,
      winrate: confirmed.length ? Math.round(wins / confirmed.length * 100) : 0
    });
    buildConfirms();
  } else {
    state.session = null;
    CONFIRMS = [];
  }
  applyBrandIcon();
  if (doRender !== false) render();
}

/* 服务端模式下，待我确认 = 对手提交、且我是另一方的战报；站长可代确认 */
function buildConfirms(){
  const mine = state.session && state.session.guild;
  const admin = state.session && state.session.role === "admin";
  CONFIRMS = MATCHES.filter(m => m.status === "pending" &&
      ((mine && (m.aSlug === mine || m.bSlug === mine) && m.reporterId !== ME_ID) || admin)
    ).map(m => {
      const a = bySlug(m.aSlug), b = bySlug(m.bSlug);
      return {
        id: m.id,
        mine: a ? a.name : "?",
        other: b ? b.name : "?",
        sa: m.sa, sb: m.sb, map: m.map, time: m.timeText,
        by: (a ? a.name : "?") + " · 对手",
        win: true
      };
    });
}

async function op(type, payload){
  try {
    const d = await api("/api/op", { method: "POST", body: JSON.stringify(Object.assign({ type }, payload || {})) });
    applyServer(d);
    return true;
  } catch (e) {
    toast(e.message || "操作失败");
    return false;
  }
}

function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    if(d.guilds && d.guilds.length){ GUILDS.length = 0; d.guilds.forEach(g => GUILDS.push(g)); }
    if(d.reviews) REVIEWS = d.reviews;
    if(d.reports) REPORTS = d.reports;
    if(d.confirms) CONFIRMS = d.confirms;
    if(d.mails) MAILS = d.mails;
    if(d.my) state.myReports = d.my;
    if(d.signups) state.signups = d.signups;
    if(d.removed) state.removed = d.removed;
    if(d.session !== undefined) state.session = d.session;
    if(d.honors){ Object.keys(HONORS).forEach(k => delete HONORS[k]); Object.assign(HONORS, d.honors); }
    if(d.bracket){ BRACKET.length = 0; d.bracket.forEach(r => BRACKET.push(r)); }
    if(d.site) Object.assign(SITE, d.site);
  }catch(e){}
}

function brandMark(){
  const L = Object.assign({ mode: "image", url: "/assets/logo.svg", height: 27 }, SITE.logo || {});
  const h = Math.max(16, Math.min(48, parseInt(L.height, 10) || 27));
  if (L.mode === "image" && L.url) {
    return `<img class="mark-img" src="${esc(L.url)}" alt="" style="height:${h}px">`;
  }
  return `<span class="mark-txt" style="width:${h}px;height:${h}px;font-size:${Math.round(h * 0.46)}px">${esc(firstChar(SITE.brand))}</span>`;
}

async function uploadLogo(file){
  if (!file) return;
  if (!SERVER_MODE) { toast("上传需要服务端，演示模式请直接填图片地址"); return; }
  if (file.size > 1.5 * 1024 * 1024) { toast("图片请小于 1.5 MB"); return; }
  const dataUrl = await new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => res("");
    fr.readAsDataURL(file);
  });
  if (!dataUrl) { toast("读取文件失败"); return; }
  try {
    const d = await api("/api/upload", { method: "POST", body: JSON.stringify({ dataUrl }) });

const bySlug = s => GUILDS.find(g => g.slug === s);
const sorted = () => GUILDS.slice().sort((a,b) => b.points - a.points);
const rankOf = slug => sorted().findIndex(g => g.slug === slug) + 1;
const seasonK = () => state.season === "S3" ? 1 : state.season === "S2" ? 0.93 : 0.88;
const pts = g => Math.round(g.points * seasonK());
const form = g => {
  const out = [];
  for (let i=0;i<5;i++) out.push(((i + g.level + g.name.length) % 3) !== 0 ? "w" : "l");
  return out;
};
const memberCount = g => SERVER_MODE
  ? ((g.roster || []).length || g.members || 0)
  : Math.max(0, g.members - state.removed.filter(k => k.indexOf(g.slug + ":") === 0).length);
const roster = g => {
  if (SERVER_MODE) {
    return (g.roster || []).map(m => ({
      name: m.name, role: m.role, contrib: m.contrib || 0,
      online: !!m.online, joined: m.joined || "—"
    }));
  }
  const n = Math.min(g.members, 16);
  return Array.from({length:n}, (_,i) => ({
    name: i === 0 ? "林深" : NAMES[(i*5 + g.name.length) % NAMES.length],
    role: i === 0 ? "会长" : ROLES[i] || "成员",
    contrib: Math.round((g.members - i) * 1370 + (i*233)%900),
    online: i < Math.max(2, Math.round(g.online/2)),
    joined: ["2025-11-02","2025-12-18","2026-01-09","2026-02-14","2026-03-21","2026-04-07"][i%6]
  })).filter(m => !state.removed.includes(g.slug + ":" + m.name));
};
const recentMatches = g => {
  if (SERVER_MODE) {
    return MATCHES.filter(m => m.aSlug === g.slug || m.bSlug === g.slug).map(m => {
      const isA = m.aSlug === g.slug;
      const opp = bySlug(isA ? m.bSlug : m.aSlug) || {name:"未知公会", badge:"?", color:"#39414B"};
      const mine = isA ? m.sa : m.sb, theirs = isA ? m.sb : m.sa;
      return {id:m.id, opp, sa:mine, sb:theirs, win:mine > theirs, st:m.status, map:m.map, time:m.timeText};
    });
  }
  const others = GUILDS.filter(x => x.slug !== g.slug);
  const maps = MAPS;
  const times = ["2 小时前","5 小时前","昨天 21:40","10-17","10-15","10-14","10-12","10-11","10-09"];
  return Array.from({length:9}, (_,i) => {
    const o = others[(g.level*3 + i*5) % others.length];
    const win = (i + g.level) % 3 !== 0;
    const st = i === 1 || i === 7 ? "pending" : i === 4 ? "disputed" : "confirmed";
    return {opp:o, sa: win?2:1, sb: win?(i%2):2, win, st,
      map: maps[(i+g.level)%maps.length].name, time: times[i]};
  });
};
const honorsOf = g => HONORS[g.slug] || [{y:"2026", t:"第 3 赛季 参赛", tier:"B", r:"参赛", n:""}];
const bmap = name => {

};

function filteredGuilds(){
  let list = sorted();
  if (state.rankServer !== "all") list = list.filter(g => g.server === state.rankServer);
  if (state.rankQ.trim()) {
    const q = state.rankQ.trim().toLowerCase();
    list = list.filter(g => g.name.toLowerCase().includes(q) || g.slug.includes(q));
  }
  if (state.rankSort === "win") list = list.slice().sort((a,b) => b.wr - a.wr);
  if (state.rankSort === "members") list = list.slice().sort((a,b) => b.members - a.members);
  if (state.rankSort === "level") list = list.slice().sort((a,b) => b.level - a.level || b.points - a.points);
  return list;
}

        ${["霜原服","岚岛服","橡木服","星海服"].map(s => `<option value="${s}" ${state.rankServer===s?"selected":""}>${s}</option>`).join("")}
      </select>
      <div class="search">
        ${ic("search")}

      </div>
      <div class="segs" style="margin-left:auto">
        <button data-act="sort" data-v="points" class="${state.rankSort==="points"?"on":""}">积分</button>
        <button data-act="sort" data-v="win" class="${state.rankSort==="win"?"on":""}">胜率</button>
        <button data-act="sort" data-v="members" class="${state.rankSort==="members"?"on":""}">人数</button>
        <button data-act="sort" data-v="level" class="${state.rankSort==="level"?"on":""}">等级</button>

    </div>

    <div style="height:60px"></div>
  </div></div>`;
}

/* ============ GUILD ============ */
function GuildView(slug){
  const g = bySlug(slug);

  const rk = rankOf(g.slug);
  const hs = honorsOf(g);
  const ms = recentMatches(g);

  const joined = state.session && g.slug === ME.guild;

  const tabs = [
    ["overview","概览",""],
    ["members","成员",memberCount(g)],

              <span class="pill g">S3 第 ${rk} 名</span>
              ${g.tags.map(t => `<span class="pill">${t}</span>`).join("")}
              <span class="pill ${g.recruit?"t":""}">${g.recruit?"招募中":"已满员"}</span>

            <div class="gs-meta">${g.server} · ${memberCount(g)} 名成员 · 成立于 ${g.founded}</div>

    <div class="panes">
      ${tab === "overview" ? `
      <div class="pane">
        <div style="display:flex;flex-direction:column;gap:14px">
          <div class="card box">
            <h3>公会简介</h3>

      ${tab === "members" ? `

            <h3 style="margin:0">成员 · ${memberCount(g)} 人</h3>

          <table class="logs" style="width:100%">

              <td style="width:70px;text-align:right">${m.online?`<span class="online"></span> 在线`:`<span class="offline"></span> <span class="mut">离线</span>`}</td>
              <td class="mono" style="width:100px;text-align:right;color:#5C6774;white-space:nowrap">${m.joined}</td>
              ${g.slug === ME.guild && state.session ? `<td style="width:56px;text-align:right">${m.name !== ME.name ? `<button class="btn g sm" data-act="kick" data-g="${g.slug}" data-n="${m.name}" style="padding:2px 7px;font-size:10px">移出</button>` : ""}</td>` : ""}
            </tr>`).join("")}

          </table>
          <div class="hint" style="margin-top:12px">仅展示前 ${rs.length} 位成员，按贡献排序。</div>
        </div>
      </div>` : ""}

      ${tab === "honors" ? `
      <div class="pane one">
        <div class="card box">
          <h3>荣誉墙 · ${hs.length} 项</h3>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;margin-top:12px">
            ${hs.map(h => `<div style="border:1px solid ${h.tier==="S"?"rgba(232,180,75,.26)":"var(--line)"};border-radius:10px;padding:14px;background:${h.tier==="S"?"rgba(232,180,75,.05)":"var(--s850)"}">
              <div style="display:flex;align-items:center;gap:8px">
                <span class="tier ${h.tier}">${h.tier}</span>
                <b style="font-size:12.5px">${h.t}</b>
              </div>
              <div style="font-size:11.5px;color:var(--mut);margin-top:8px">${h.y} · ${h.r}</div>
              ${h.n?`<div style="font-size:11px;color:#8C97A3;margin-top:4px">${h.n}</div>`:""}
            </div>`).join("")}
          </div>
        </div>
      </div>` : ""}

      ${tab === "matches" ? `
      <div class="pane one">
        <div class="card box">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
            <div>
              <h3 style="margin:0">战报</h3>
              <div class="hint" style="margin-top:4px">最近 ${ms.length} 场 · ${ms.filter(m=>m.st==="confirmed").length} 已确认 · ${ms.filter(m=>m.st==="pending").length} 待确认 · ${ms.filter(m=>m.st==="disputed").length} 争议中</div>
            </div>
            ${g.slug === ME.guild ? `<button class="btn p sm" data-act="submit-match" data-g="${g.slug}">提交战报</button>` : ""}
          </div>
          ${g.slug === ME.guild && state.myReports.length ? `
          <div style="margin-top:14px;padding:10px 12px;border:1px dashed rgba(232,180,75,.32);border-radius:8px;background:rgba(232,180,75,.04)">
            <div style="font:10px var(--mono);color:var(--gd);letter-spacing:.1em;margin-bottom:4px">我刚提交 · 等待对方确认</div>

        </div>
      </div>` : ""}

      ${tab === "recruit" ? `
      <div class="pane">
        <div class="card box">
          <h3>招募要求</h3>
          <p>${g.recruit ? "我们正在寻找愿意长期一起玩的人，而不是只打一季的过客。" : "当前满员。你仍然可以提交申请，我们会在有空位时联系你。"}</p>

    </div>
    <div style="height:56px"></div>
  </div></div>`;

/* 真实登录 / 注册 */
/* ============ 人机验证（极验 4.0） ============ */
const GT = { scene: null, result: null, obj: null, loading: null };

function gtCfg(){ return SITE.geetest || {}; }
function gtOn(scene){
  const g = gtCfg();
  if (!g.enabled || !g.captchaId) return false;
  const sc = g.scenes || {};
  return sc[scene] !== false;
}
function loadGt4(){
  if (window.initGeetest4) return Promise.resolve();
  if (GT.loading) return GT.loading;
  GT.loading = new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = "https://static.geetest.com/v4/gt4.js";
    el.async = true;
    el.onload = () => res();
    el.onerror = () => rej(new Error("脚本加载失败"));
    document.head.appendChild(el);
    setTimeout(() => { if (!window.initGeetest4) rej(new Error("加载超时")); }, 8000);
  });
  return GT.loading;
}
function gtHint(){
  const h = $("#gt-hint");
  if (!h) return;
  if (!gtOn(GT.scene)) { h.textContent = ""; h.style.display = "none"; return; }
  h.style.display = "block";
  h.textContent = GT.result ? "✓ 人机验证已通过" : (GT.obj ? "提交时弹出验证，完成后再点一次提交" : "正在加载验证组件…");
}
async function mountGt(scene){
  GT.scene = scene; GT.result = null; GT.obj = null;
  gtHint();
  if (!gtOn(scene)) return;
  try {
    await loadGt4();
    if (GT.scene !== scene) return;
    initGeetest4({ captchaId: gtCfg().captchaId, product: "bind", language: "zho" }, cap => {
      GT.obj = cap;
      cap.onSuccess(() => { GT.result = cap.getValidate(); gtHint(); });
      cap.onError(() => { GT.result = null; gtHint(); });
      cap.onClose(() => { gtHint(); });
      gtHint();
    });
  } catch (e) {
    const h = $("#gt-hint");
    if (h) { h.style.display = "block"; h.textContent = "验证组件加载失败：" + e.message + "（可联系站长关闭人机验证）"; }
  }
}
function gtBlock(scene){
  if (!gtOn(scene)) return false;
  if (GT.result) return false;
  if (GT.obj) {
    try { GT.obj.showBox ? GT.obj.showBox() : GT.obj.showCaptcha(); } catch (e) {}
    toast("请先完成人机验证");
  } else {
    toast("验证组件还在加载，请稍候");
  }
  return true;
}

/* BP */
function openBp(){
  state.bp = {step:0, status:{}, order:[
    {t:"A", k:"ban", label:"霜序 BAN"},
    {t:"B", k:"ban", label:"红石工坊 BAN"},
    {t:"A", k:"pick", label:"霜序 PICK"},
    {t:"B", k:"pick", label:"红石工坊 PICK"},
    {t:"-", k:"auto", label:"剩余为决胜图"}
  ]};
  renderBp();
}
function renderBp(){
  const bp = state.bp;
  if (!bp) return;
  const cur = bp.order[bp.step] || bp.order[4];
  const left = MAPS.filter(m => !bp.status[m.id]);
  const done = bp.step >= 4;
  let title = done ? "BP 完成 · 最终地图" : cur.label + " 阶段";
  if (!done && bp.step === 4) title = "BP 完成 · 最终地图";

  const body = `<div class="modal" data-stop="1" style="max-width:620px">
    <div class="modal-h">
      <b>地图 BP · 霜序 vs 红石工坊</b>
      <button class="x" data-act="close-modal">✕</button>
    </div>
    <div class="modal-b">
      <div class="bp-step">
        ${bp.order.map((o,i) => `<span class="${i===bp.step?"on":i<bp.step?"done":""}">${i+1}. ${o.label}</span>`).join("")}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px">
        <b style="font-size:13px">${title}</b>
        <span class="mono" style="font-size:10px;color:var(--mut)">BO3 · 7 图池</span>
      </div>
      <div class="mapgrid">
        ${MAPS.map(m => {
          const st = bp.status[m.id];
          return `<div class="map ${st==="ban"?"banned":st==="pick"?"picked":""}" data-act="bp-pick" data-id="${m.id}">
            <div class="tint" style="background:linear-gradient(150deg,${hexA(m.c1,.55)},${m.c2})"></div>
            <span>${m.name}</span>
          </div>`;
        }).join("")}
      </div>
      <div style="margin-top:14px;font-size:12px;color:var(--tx2)">
        ${done || bp.step > 4 ? `<span class="pill t">决胜图</span> ${left[0] ? left[0].name : "—"} · 剩余 ${left.length} 张` :
          `剩余 ${left.length} 张可选 · 双方各 ban 1、pick 1`}
      </div>
    </div>
    <div class="modal-f">
      <button class="btn g" data-act="bp-reset">重置</button>
      <button class="btn p" data-act="${done?"bp-finish":"close-modal"}">${done?"完成 BP":"暂存"}</button>
    </div>
  </div>`;
  openModal(body);
}

/* 对阵图：按实际卡高把后续轮次垂直居中 */
function layoutBracket(){
  const qf = document.querySelectorAll(".bround:first-child .bm");
  const midB = document.querySelectorAll(".bround.mid .bm");
  const lastB = document.querySelector(".bround.last .bm");
  if (!qf.length) return;
  const h = qf[0].getBoundingClientRect().height;
  if (!h) return;
  const g = 14;
  if (midB[0]) midB[0].style.marginTop = (h/2 + g/2) + "px";
  if (midB[1]) midB[1].style.marginTop = (h + g) + "px";
  if (lastB) lastB.style.marginTop = (h*1.5 + g*1.5) + "px";
}

function render(){
  const h = location.hash.replace(/^#/, "") || "/";

  else if (h === "/rank") html = RankView();
  else if (h.startsWith("/g/")) html = GuildView(h.slice(3));
  else if (h === "/events") html = EventsView();
  else if (h.startsWith("/event/")) html = EventView(h.slice(7));
  else if (h === "/me") html = MeView();
  else if (h === "/admin") html = AdminView();
  else html = `<div class="wrap"><div class="empty" style="padding:120px 0"><b>页面不存在</b><a class="btn g" href="#/" style="margin-top:16px">回首页</a></div></div>`;

  app.innerHTML = html;
  renderHeader();
  layoutBracket();
  window.scrollTo({top:0, behavior:"instant"});
  saveDB();
}

/* ============ EVENTS ============ */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (!t) { if (state.menu) { state.menu = false; renderHeader(); } return; }
  const act = t.dataset.act;
  if (act === "close-modal") {
    if (t.classList.contains("overlay") && e.target !== t) return;
    closeModal(); return;
  }
  if (t.closest(".modal") && act !== "close-modal" && t.dataset.stop === "1") return;

  switch (act) {
    case "go": state.menu = false; location.hash = t.dataset.href; break;
    case "login-open": state.menu = false; renderHeader(); loginModal(); break;
    case "auth-mode": { GT.result = null; GT.obj = null; authModal(t.dataset.v); break; }
    case "auth-submit": {
      const mode = t.dataset.v;
      const username = ($("#au-user").value || "").trim();
      const password = $("#au-pass").value || "";
      if (!username || !password) { toast("请填写用户名和密码"); break; }
      if (SERVER_MODE && gtBlock(mode)) break;
      const body = { username, password, captcha: GT.result };
      if (mode === "register") {
        const em = $("#au-email"), cd = $("#au-code");
        body.name = ($("#au-name").value || "").trim() || username;
        body.mc = ($("#au-mc").value || "").trim();
        body.email = em ? em.value.trim() : "";
        body.code = cd ? cd.value.trim() : "";
        if (SITE.mail && SITE.mail.requireVerify) {
          if (!body.email) { toast("请填写邮箱"); break; }
          if (!body.code) { toast("请填写邮箱验证码"); break; }
        }
      }
      t.disabled = true;
      api(mode === "register" ? "/api/register" : "/api/login", { method: "POST", body: JSON.stringify(body) })
        .then(d => { applyServer(d); closeModal(); toast(mode === "register" ? "注册成功，欢迎加入" : "欢迎回来"); })
        .catch(e => { toast(e.message); t.disabled = false; });
      break;
    }
    case "register-open": { e.preventDefault ? e.preventDefault() : 0; authModal("register"); break; }
    case "pass-open": {
      if (!SERVER_MODE) { toast("演示模式没有账号密码"); break; }
      if (!state.session) { toast("请先登录"); break; }
      state.menu = false; renderHeader(); passModal();
      break;
    }
    case "pass-save": {
      const o = $("#pw-old").value || "";
      const n1 = $("#pw-new").value || "";
      const n2 = $("#pw-new2").value || "";
      if (!o) { toast("请填写当前密码"); break; }
      if (n1.length < 6) { toast("新密码至少 6 位"); break; }
      if (n1 !== n2) { toast("两次输入的新密码不一致"); break; }
      t.disabled = true;
      api("/api/password/change", { method: "POST", body: JSON.stringify({ old: o, new: n1 }) })
        .then(() => { closeModal(); toast("密码已修改，下次请用新密码登录"); })
        .catch(e => { toast(e.message); t.disabled = false; });
      break;
    }
    case "email-open": { if (!SERVER_MODE) { toast("演示模式无需绑定邮箱"); break; } emailModal(); break; }
    case "email-save": {
      const email = ($("#em-val").value || "").trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { toast("邮箱格式不正确"); break; }
      op("setEmail", { email }).then(ok => { if (ok) { closeModal(); toast("邮箱已更新"); } });
      break;
    }
    case "email-clear": {
      op("setEmail", { email: "" }).then(ok => { if (ok) { closeModal(); toast("已解绑邮箱"); } });
      break;
    }
    case "reset-open": { resetModal(); break; }
    case "send-code": {
      const scene = t.dataset.scene === "reset" ? "reset" : "register";
      const em = scene === "reset" ? $("#rs-email") : $("#au-email");
      const email = em ? em.value.trim() : "";
      if (!email) { toast("请先填写邮箱"); break; }
      if (!SERVER_MODE) { toast("演示模式没有服务端，无法发信"); break; }
      const old = t.textContent;
      t.disabled = true; t.textContent = "发送中…";
      api("/api/mail/code", { method: "POST", body: JSON.stringify({ email, scene }) })
        .then(() => {
          toast("验证码已发送，10 分钟内有效");
          let n = 60;
          t.textContent = n + "s";
          const iv = setInterval(() => {
            n -= 1;
            t.textContent = n + "s";
            if (n <= 0) { clearInterval(iv); t.disabled = false; t.textContent = old; }
          }, 1000);
        })
        .catch(e => { toast(e.message); t.disabled = false; t.textContent = old; });
      break;
    }
    case "reset-submit": {
      const email = ($("#rs-email").value || "").trim();
      const code = ($("#rs-code").value || "").trim();
      const pass = $("#rs-pass").value || "";
      if (!email || !code) { toast("请填写邮箱和验证码"); break; }
      if (pass.length < 6) { toast("新密码至少 6 位"); break; }
      if (gtBlock("reset")) break;
      const btn = t;
      btn.disabled = true;
      api("/api/password/reset", { method: "POST", body: JSON.stringify({ email, code, password: pass, captcha: GT.result }) })
        .then(() => { closeModal(); toast("密码已重置，请用新密码登录"); authModal("login"); })
        .catch(e => { toast(e.message); btn.disabled = false; });
      break;
    }
    case "login-as": {
      const r = t.dataset.role;
      state.session = r === "guest" ? null : r === "admin" ? {name:"阿岚", role:"admin"} : {name:"林深", role:"owner"};
      state.menu = false;
      closeModal(); render();
      toast(r === "guest" ? "已退出登录" : r === "admin" ? "已切换为管理员视角" : "已切换为玩家视角");
      break;
    }
    case "logout": {
      if (SERVER_MODE) {
        api("/api/logout", { method: "POST" }).then(() => {
          state.session = null; ME_ID = null; CONFIRMS = []; state.menu = false;
          render(); toast("已退出登录");
        }).catch(() => toast("退出失败"));
        break;
      }
      state.session = null; state.menu = false; render(); toast("已退出登录"); break;
    }
    case "user-menu": state.menu = !state.menu; renderHeader(); break;
    case "theme": {
      const cur = document.documentElement.getAttribute("data-theme") === "light" ? "light" : "dark";
      const next = cur === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("fb_theme", next); } catch (e) {}
      renderHeader();
      break;
    }
    case "apply": {
      if (!state.session) { loginModal(); toast("请先登录"); break; }
      if (state.applied) { toast("你已经提交过申请了，等待审核"); break; }
      applyModal(t.dataset.g); break;
    }
    case "apply-confirm": {
      if (SERVER_MODE) {
        const slug = t.dataset.g;
        const msgEl = $("#apply-msg");
        op("joinGuild", { slug, message: msgEl ? msgEl.value : "" }).then(ok => {
          if (ok) { closeModal(); toast("已加入公会 / 申请已提交"); }
        });
        break;
      }
      state.applied = true; closeModal(); render();
      toast("申请已提交 · 会长审核后会收到站内信"); break;
    }
    case "submit-match": {
      if (!state.session) { loginModal(); toast("请先登录"); break; }
      submitMatchModal(t.dataset.g || ME.guild); break;
    }
    case "submit-match-confirm": {
      if (SERVER_MODE) {
        const oppName = $("#sm-opp").value;
        const oppG = GUILDS.find(x => x.name === oppName);
        const sa = +$("#sm-a").value, sb = +$("#sm-b").value;
        const map = $("#sm-map").value;
        if (sa === sb) { toast("比分不能相同，请检查后重填"); break; }
        op("reportMatch", { oppSlug: oppG ? oppG.slug : "", sa, sb, map }).then(ok => {
          if (ok) { closeModal(); state.guildTab = "matches"; render(); toast("已提交 · 已通知「" + oppName + "」确认"); }
        });
        break;
      }
      const opp = $("#sm-opp").value;
      const sa = +$("#sm-a").value, sb = +$("#sm-b").value;
      const map = $("#sm-map").value;
      if (sa === sb) { toast("比分不能相同，请检查后重填"); break; }
      state.myReports.unshift({opp, sa, sb, map});
      state.guildTab = "matches";
      closeModal();
      if (state.route.startsWith("/g/")) render(); else location.hash = "#/g/" + ME.guild;
      toast("已提交 · 已通知「" + opp + "」确认");
      break;
    }
    case "confirm-match": {
      if (SERVER_MODE) {
        op("confirmMatch", { id: t.dataset.id }).then(ok => { if (ok) toast("已确认 · 积分已更新"); });
        break;
      }
      const c = CONFIRMS.find(x => x.id === t.dataset.id);
      CONFIRMS = CONFIRMS.filter(x => x.id !== t.dataset.id);
      const mg = bySlug(ME.guild);
      if (c && c.win) mg.points += 6;
      render();
      toast("已确认 · 积分 " + (c && c.win ? "+6" : "−6") + " 已计入");
      break;
    }
    case "reject-match": {
      if (SERVER_MODE) {
        op("disputeMatch", { id: t.dataset.id, reason: "对方提出异议" }).then(ok => { if (ok) toast("已提出异议，转入争议"); });
        break;
      }
      const c = CONFIRMS.find(x => x.id === t.dataset.id);
      CONFIRMS = CONFIRMS.filter(x => x.id !== t.dataset.id);
      render();
      toast("已提出异议，该场次转入争议（" + (c ? c.other : "") + "）");
      break;
    }
    case "report-guild": toast("举报已提交，等待站务处理"); break;
    case "help": helpModal(); break;
    case "create-guild": createGuildModal(); break;
    case "cg-color": {
      $("#cg-color").value = t.dataset.c;
      document.querySelectorAll("#cg-colors .cgc").forEach(b => b.classList.toggle("on", b === t));
      break;
    }
    case "create-guild-confirm": {
      if (SERVER_MODE) {
        const nm = ($("#cg-name").value || "").trim();
        if (nm.length < 2) { toast("公会名至少 2 个字"); break; }
        op("createGuild", {
          name: nm, badge: $("#cg-badge").value, color: $("#cg-color").value,
          server: $("#cg-server").value, intro: ($("#cg-intro").value || "").trim()
        }).then(ok => { if (ok) { closeModal(); toast("已提交建会申请，等待站务审核"); } });
        break;
      }
      const name = ($("#cg-name").value || "").trim();
      const intro = ($("#cg-intro").value || "").trim();
      if (name.length < 2) { toast("公会名至少 2 个字"); break; }
      if (GUILDS.some(g => g.name === name) || REVIEWS.some(r => r.name === name)) { toast("这个公会名已经被占用了"); break; }
      const badge = firstChar($("#cg-badge").value || name);
      REVIEWS.unshift({id:"r" + Date.now(), name, badge, color: $("#cg-color").value,
        by: state.session.name, server: $("#cg-server").value, time:"刚刚",
        intro: intro || "新提交的公会，还没有写简介。"});
      closeModal(); render();
      toast("已提交建会申请，等待站务审核");
      break;
    }
    case "match-detail": {
      const slug = state.route.startsWith("/g/") ? state.route.slice(3) : "";
      matchDetailModal(slug, +t.dataset.i);
      break;
    }
    case "edit-guild": editGuildModal(t.dataset.g); break;
    case "edit-guild-confirm": {
      if (SERVER_MODE) {
        op("editGuild", { slug: t.dataset.g, intro: $("#eg-intro").value.trim(), recruit: $("#eg-recruit").value === "1" })
          .then(ok => { if (ok) { closeModal(); toast("公会资料已保存"); } });
        break;
      }
      const eg = bySlug(t.dataset.g);
      eg.intro = $("#eg-intro").value.trim() || eg.intro;
      eg.recruit = $("#eg-recruit").value === "1";
      closeModal(); render(); toast("公会资料已保存");
      break;
    }
    case "kick": {
      if (SERVER_MODE) {
        op("kickMember", { name: t.dataset.n }).then(ok => { if (ok) toast("已移出 " + t.dataset.n); });
        break;
      }
      const key = t.dataset.g + ":" + t.dataset.n;
      if (!state.removed.includes(key)) state.removed.push(key);
      render(); toast("已移出 " + t.dataset.n);
      break;
    }
    case "signup": {
      if (!state.session) { loginModal(); toast("请先登录"); break; }
      if (SERVER_MODE) {
        op("signup", { tournamentId: t.dataset.t }).then(ok => { if (ok) toast("报名成功"); });
        break;
      }
      state.signups[t.dataset.t] = "霜序";
      render(); toast("报名成功 · 已通知赛事组");
      break;
    }
    case "save-score": {
      if (SERVER_MODE) {
        const sid = t.dataset.id;
        const s1 = +$("#sc-" + sid + "-a").value, s2 = +$("#sc-" + sid + "-b").value;
        if (s1 === s2) { toast("淘汰赛不能平局，请检查比分"); break; }
        op("saveScore", { id: sid, sa: s1, sb: s2 }).then(ok => { if (ok) toast("比分已保存"); });
        break;
      }
      const id = t.dataset.id;
      const sa = +$("#sc-" + id + "-a").value, sb = +$("#sc-" + id + "-b").value;
      if (sa === sb) { toast("淘汰赛不能平局，请检查比分"); break; }
      let mt = null;
      BRACKET.forEach(r => r.ms.forEach(m => { if (m.id === id) mt = m; }));
      if (!mt) break;
      mt.sa = sa; mt.sb = sb; mt.done = true;
      const winner = sa > sb ? mt.a : mt.b;
      const final = BRACKET[2].ms[0];
      if (id === "r2m1") final.a = winner;
      if (id === "r2m2") final.b = winner;
      render(); toast("比分已保存 · " + winner + " 晋级");
      break;
    }
    case "save-settings": {
      const site = collectSettings();
      if (SERVER_MODE) {
        op("saveSettings", { site }).then(ok => { if (ok) { applyBrandIcon(); toast("站点设置已保存"); } });
      } else {
        Object.assign(SITE, site);
        saveDB(); applyBrandIcon(); render(); toast("站点设置已保存");
      }
      break;
    }
    case "mail-test": {
      const to = ($("#ml-test-to") ? $("#ml-test-to").value : "").trim();
      if (!to) { toast("请填写收件邮箱"); break; }
      if (!SERVER_MODE) { toast("演示模式没有服务端，无法发信"); break; }
      toast("正在发送测试邮件…");
      api("/api/mail/test", { method: "POST", body: JSON.stringify({ to }) })
        .then(() => toast("测试邮件已发出，请查收"))
        .catch(e => toast("发送失败：" + e.message));
      break;
    }
    case "logo-pick": {
      const f = $("#lg-file"); if (f) f.click();
      break;
    }
    case "reset-db": {
      if (SERVER_MODE) {
        if (!window.confirm("确定清空全部数据并恢复示例数据？该操作不可撤销。")) break;
        op("resetData", {}).then(ok => { if (ok) toast("已重置为示例数据"); });
        break;
      }
      resetDB(); break;
    }
    case "mail-item": {
      if (SERVER_MODE) {
        state.openMail = +t.dataset.i;
        const mm = MAILS[state.openMail];
        if (mm) op("readMail", { id: mm.id }).then(() => { openMail(); renderHeader(); });
        else { openMail(); renderHeader(); }
        break;
      }
      state.openMail = +t.dataset.i;
      if (MAILS[state.openMail]) MAILS[state.openMail].unread = false;
      openMail(); renderHeader();
      break;
    }
    case "mail-read-all": {
      if (SERVER_MODE) {
        op("readMail", { all: true }).then(ok => { if (ok) { openMail(); renderHeader(); toast("全部标为已读"); } });
        break;
      }
      MAILS.forEach(m => m.unread = false);
      openMail(); renderHeader(); toast("全部标为已读");
      break;
    }
    case "gtab": state.guildTab = t.dataset.v; render(); break;
    case "atab": state.adminTab = t.dataset.v; render(); break;
    case "sort": state.rankSort = t.dataset.v;
      document.querySelectorAll("[data-act='sort']").forEach(b => b.classList.toggle("on", b.dataset.v === state.rankSort));
      $("#rank-host").innerHTML = rankTable(filteredGuilds(), false);
      break;
    case "mail-open": state.menu = false; renderHeader(); openMail(); break;
    case "mail-close": closeMail(); break;
    case "search-open": state.menu = false; renderHeader(); searchModal(); break;
    case "bp-open": openBp(); break;
    case "bp-pick": {
      const bp = state.bp;
      if (!bp || bp.step > 4) break;
      const id = t.dataset.id;
      if (bp.status[id]) { toast("这张图已经被处理过了"); break; }
      const step = bp.order[bp.step];
      if (step.k === "auto") break;
      bp.status[id] = step.k;
      bp.step++;
      renderBp();
      break;
    }
    case "bp-reset": state.bp = {step:0, status:{}, order:state.bp.order}; renderBp(); break;
    case "bp-finish": closeModal(); toast("BP 已提交，最终地图已锁定"); break;
    case "rev-approve": {
      if (SERVER_MODE) { op("reviewGuild", { id: t.dataset.id, approve: true }).then(ok => { if (ok) toast("已通过建会申请，已上榜"); }); break; }
      const id = t.dataset.id;
      const r = REVIEWS.find(x => x.id === id);
      REVIEWS = REVIEWS.filter(x => x.id !== id);
      if (r && !GUILDS.some(g => g.name === r.name)) {
        GUILDS.push({slug:"g" + Date.now(), name:r.name, badge:r.badge, color:r.color, level:1, points:1000,
          wr:0, members:1, trend:0, recruit:true, server:r.server, founded:"2026-10-19", online:1,
          tags:["新会"], intro:r.intro});
      }
      render(); toast(`已通过「${r.name}」的建会申请，已上榜`); break;
    }
    case "rev-reject": {
      if (SERVER_MODE) { op("reviewGuild", { id: t.dataset.id, approve: false }).then(ok => { if (ok) toast("已驳回建会申请"); }); break; }
      const id = t.dataset.id;
      const r = REVIEWS.find(x => x.id === id);
      REVIEWS = REVIEWS.filter(x => x.id !== id);
      render(); toast(`已驳回「${r.name}」，站内信已通知`); break;
    }
    case "rep-uphold": {
      if (SERVER_MODE) { op("resolveReport", { id: t.dataset.id, uphold: true }).then(ok => { if (ok) toast("举报成立，已扣分"); }); break; }
      const id = t.dataset.id;
      const r = REPORTS.find(x => x.id === id);
      REPORTS = REPORTS.filter(x => x.id !== id);
      render(); toast(`举报成立：${r.target} 将被扣分并警告`); break;
    }
    case "rep-dismiss": {
      if (SERVER_MODE) { op("resolveReport", { id: t.dataset.id, uphold: false }).then(ok => { if (ok) toast("已驳回举报"); }); break; }
      const id = t.dataset.id;
      const r = REPORTS.find(x => x.id === id);
      REPORTS = REPORTS.filter(x => x.id !== id);
      render(); toast(`已驳回对「${r.target}」的举报`); break;
    }
    case "honor-award": {
      if (SERVER_MODE) {
        const gsel = $("#h-guild"), tt = $("#h-title"), rk = $("#h-rank"), tr2 = $("#h-tier");
        if (!tt.value.trim() || !rk.value.trim()) { toast("请填写荣誉名称与名次"); break; }
        op("awardHonor", { slug: gsel.value, title: tt.value.trim(), rank: rk.value.trim(), tier: tr2.value })
          .then(ok => { if (ok) toast("荣誉已颁发"); });
        break;
      }
      const gi = $("#h-guild"), ti = $("#h-title"), ri = $("#h-rank"), tr = $("#h-tier");
      if (!ti.value.trim() || !ri.value.trim()) { toast("请填写荣誉名称与名次"); break; }
      const g = bySlug(gi.value);
      HONORS[g.slug] = HONORS[g.slug] || [];
      HONORS[g.slug].unshift({y:"2026", t:ti.value.trim(), tier:tr.value, r:ri.value.trim(), n:"由站务颁发"});
      toast(`已向「${g.name}」颁发荣誉：${ti.value.trim()}`); break;
    }
    case "toast": toast(t.dataset.msg || "已完成"); break;
    default: break;
  }
});

document.addEventListener("change", (e) => {
  if (e.target && e.target.id === "lg-file") { uploadLogo(e.target.files && e.target.files[0]); return; }
  const s = e.target.closest("[data-sel]");
  if (!s) return;
  const k = s.dataset.sel;
  if (k === "rankServer") { state.rankServer = s.value; $("#rank-host").innerHTML = rankTable(filteredGuilds(), false); }
  if (k === "rankSeason") { state.rankSeason = s.value; state.season = s.value; render(); }
});

document.addEventListener("input", (e) => {
  if (e.target && e.target.id === "lg-url") {
    const prev = $("#lg-prev");
    if (prev) prev.src = e.target.value.trim() || "/assets/logo.svg";
  }
  const i = e.target.closest("[data-q]");
  if (!i) return;
  if (i.dataset.q === "rank") {
    state.rankQ = i.value;
    $("#rank-host").innerHTML = rankTable(filteredGuilds(), false);
  }
  if (i.dataset.q === "global") {
    state.searchQ = i.value;
    const box = $("#sres");
    if (box) box.innerHTML = searchResults();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); closeMail(); if (state.menu) { state.menu = false; renderHeader(); } }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); searchModal(); }
});

window.addEventListener("hashchange", () => { state.menu = false; render(); });

/* boot */
(async function boot(){
  try {
    const r = await fetch("/api/bootstrap", { cache: "no-store" });
    if (r.ok) {
      SERVER_MODE = true;
      applyServer(await r.json(), false);
    }
  } catch (e) { /* 没有服务端，走本地演示模式 */ }

  if (!SERVER_MODE) {
    try {
      const qp = new URLSearchParams(location.search);
      if (qp.get("reset") === "1") localStorage.removeItem("fangbei_guild_v2");
    } catch (e) {}
    loadDB();
    try {
      const qp = new URLSearchParams(location.search);
      const role = qp.get("role");
      if (role === "admin") state.session = {name:"阿岚", role:"admin"};
      if (role === "guest") state.session = null;
    } catch (e) {}
  }
  applyBrandIcon();
  render();
})();
