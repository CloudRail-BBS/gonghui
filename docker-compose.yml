services:
  fangbei:
    build: .
    image: fangbei-guildhall:1.3.0
    container_name: fangbei
    restart: unless-stopped
    init: true
    # 宿主机端口和容器端口都用 ${PORT}：
    # 在 .env 里写 PORT=8080，就同时变成「容器监听 8080」和「宿主机 8080 → 容器 8080」
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      PORT: ${PORT:-3000}
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      # 仅用于「忘记密码」：ADMIN_RESET_PASS=1 时改用 ADMIN_PASS 覆盖站长密码
      ADMIN_PASS: ${ADMIN_PASS:-}
      ADMIN_RESET_PASS: ${ADMIN_RESET_PASS:-0}
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
